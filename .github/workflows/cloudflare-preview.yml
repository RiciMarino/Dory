name: Dory Cloudflare preview

# Preview branch publishes independently of the current Sites site.
on:
  push:
    branches:
      - feature/giornate-febbraio-settembre
  workflow_dispatch:
    inputs:
      initialize_database:
        description: 'Initialize the new, empty D1 once before first deployment'
        type: boolean
        default: false
      migrate_daily_dates:
        description: 'Add optional daily booking dates to the existing D1 once'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-cloudflare-config.mjs
      - name: Initialize D1 schema
        if: inputs.initialize_database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for file in drizzle/000{0,1,2,3}_*.sql; do
            pnpm exec wrangler d1 execute DB --remote --config dist/server/wrangler.json --file "$file"
          done
      - name: Add daily booking dates
        if: inputs.migrate_daily_dates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 execute DB --remote --config dist/server/wrangler.json --file drizzle/0004_lethal_lethal_legion.sql
      - run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
